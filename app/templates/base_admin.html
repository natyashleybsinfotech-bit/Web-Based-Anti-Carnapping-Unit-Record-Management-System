<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PNP Case System{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            align-items: flex-start;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            min-width: 260px;
            flex-shrink: 0;
            background: #0f172a;
            color: white;
            padding: 20px 0 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar-header {
            text-align: center;
            padding: 25px 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 20px;
            color: white;
        }

        .sidebar-subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .user-box {
            padding: 15px 20px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            color: #e2e8f0;
        }

        .user-box strong {
            display: block;
            color: white;
            margin-bottom: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .sidebar-menu li {
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .sidebar-menu li a {
            display: block;
            padding: 14px 22px;
            color: #e2e8f0;
            text-decoration: none;
            transition: 0.2s;
            font-size: 15px;
        }

        .sidebar-menu li a:hover {
            background: #1e293b;
            color: white;
        }

        .sidebar-menu li a.active,
        .sidebar-menu li a.active:hover {
            background: #1b2a49;
            color: #e2e8f0;
            font-weight: 700;
        }

        .logout-link {
            background: #991b1b;
            color: white !important;
            text-align: center;
            font-weight: bold;
        }

        .logout-link:hover {
            background: #7f1d1d !important;
        }

        /* Main */
        .main {
            flex: 1;
            min-width: 0;
            padding: 30px;
            overflow-x: auto;
            margin-left: 260px;
        }

        .topbar {
            background: white;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 24px;
            color: #1e293b;
        }

        .topbar p {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            color: #1e293b;
        }

        .flash-message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 18px;
            background: #dbeafe;
            color: #1e3a8a;
            font-size: 14px;
            border-left: 5px solid #2563eb;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 10px 16px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #1e40af;
        }

        /* Forms */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        label {
            font-weight: bold;
            color: #334155;
            font-size: 14px;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        table th,
        table td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 14px;
        }

        table th {
            background: #f8fafc;
            color: #334155;
        }

        /* Status badges */
        .status-pending,
        .status-ongoing,
        .status-closed {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-ongoing {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-closed {
            background: #dcfce7;
            color: #166534;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="layout">
    {% include 'sidebar.html' %}

    <!-- Main Content -->
    <main class="main">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash-message">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
